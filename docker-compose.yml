version: '3.8'

services:
  jarvis:
    build: .
    container_name: jarvis-personal-ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Windows agent (only for Windows host, skip in Linux containers)
  # windows-agent:
  #   build: ./windows_agent
  #   ports:
  #     - "8001:8001"
  #   env_file:
  #     - .env
