services:
  jarvis:
    build: .
    container_name: jarvis-personal-ai
    # Bind to loopback only: this prototype is not safe to expose publicly.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      JARVIS_DB_PATH: /app/data/jarvis.sqlite3
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional Windows companion agent. It needs a Windows host, so it is kept
  # out of the Linux container by default.
  # windows-agent:
  #   build: ./windows_agent
  #   ports:
  #     - "127.0.0.1:8001:8001"
  #   env_file:
  #     - .env
