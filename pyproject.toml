[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-personal-ai"
version = "0.4.0"
description = "Enhanced Gemini-powered personal assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "google-genai>=1.0,<2.0",
    "pydantic-settings>=2.4,<3.0",
    "python-dotenv>=1.0,<2.0",
    "slowapi>=0.1.9,<1.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.13,<2.0",
    "itsdangerous>=2.2,<3.0",
    "cryptography>=43.0,<44.0",
    "python-dateutil>=2.9,<3.0",
    "structlog>=24.4,<25.0",
    "prometheus-client>=0.21,<1.0",
    "httpx>=0.27,<1.0",
    "rich>=13.8,<14.0",
    "typer>=0.12,<1.0",
    # Realtime terminal UI
    "textual>=1.0,<9.0",
    # Laptop control (Windows)
    "psutil>=5.9,<8.0",
    "mss>=9.0,<11.0",
    "pyperclip>=1.8,<2.0",
    "pillow>=10.0,<12.0",
    "pyautogui>=0.9.54,<1.0",
    "keyboard>=0.13.5,<1.0",
    "SpeechRecognition[audio]>=3.10,<4.0",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",
    "pycaw>=20240210",
    "comtypes>=1.2",
    "pygetwindow>=0.0.9",
]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-asyncio>=0.24,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-v --cov=app --cov-report=term-missing"
