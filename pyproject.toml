[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-personal-ai"
version = "0.4.0"
description = "Enhanced Gemini-powered personal assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "google-genai>=1.0,<2.0",
    "pydantic-settings>=2.4,<3.0",
    "python-dotenv>=1.0,<2.0",
    "slowapi>=0.1.9,<1.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.13,<2.0",
    "itsdangerous>=2.2,<3.0",
    "cryptography>=50.0,<51.0",
    "python-dateutil>=2.9,<3.0",
    "tzdata>=2024.1",
    "structlog>=24.4,<25.0",
    "prometheus-client>=0.21,<1.0",
    "httpx>=0.27,<1.0",
    "rich>=13.8,<14.0",
    "typer>=0.12,<1.0",
    # Laptop control (Windows)
    "psutil>=5.9,<8.0",
    "mss>=9.0,<11.0",
    "pyperclip>=1.8,<2.0",
    "pillow>=13.0,<14.0",
    "pyautogui>=0.9.54,<1.0",
    "keyboard>=0.13.5,<1.0",
    "SpeechRecognition>=3.10,<4.0",
    "PyAudio>=0.2.14; sys_platform == 'win32'",
    "sqlalchemy>=2.0,<3.0",
]

[project.scripts]
jarvis = "jarvis_cli:app"

[project.optional-dependencies]
windows = [
    "pywin32>=306",
    "pycaw>=20240210",
    "comtypes>=1.2",
    "pygetwindow>=0.0.9",
]
dev = [
    "pytest>=9.0.3,<10.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "types-python-dateutil>=2.9,<3.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=1.3,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# numpy 2.5+ stubs use PEP 695 ``type`` statements (Python 3.12+ syntax) while
# this project type-checks against its Python 3.11 floor. Treat numpy as
# untyped so mypy checks project code instead of failing inside site-packages.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-v --cov=app --cov-report=term-missing --basetemp=.pytest-tmp"

[tool.setuptools]
py-modules = ["jarvis_cli", "jarvis_daemon", "run_enhanced"]

[tool.setuptools.packages.find]
include = ["app*", "jarvis*", "windows_agent*"]

[tool.setuptools.package-data]
app = ["static/*"]
